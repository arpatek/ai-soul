name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Generated artifacts must match their sources. Catches a hand-edited
  # Modelfile or a skill change that never made it into conventions.md.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated artifacts are current
        run: ./build.sh --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck -f gcc ./*.sh scripts/*.sh

